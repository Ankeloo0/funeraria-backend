version: '3.8'

services:
  funeraria-db:
    image: postgres:15.3
    container_name: funeraria-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - funeraria_data:/var/lib/postgresql/data

volumes:
  funeraria_data: